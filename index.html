<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
<title>סיכום פרויקטים – מחלקת אוטומציה | MODY</title>
<style id="app-style">:root{
  --slab:0 1px 0 #DDD7CD,0 2px 0 #D6CFC4,0 3px 0 #CFC8BC,0 4px 0 #C9C1B4,0 5px 0 #C3BBAD,0 6px 0 #BDB4A6;
  --drop:0 26px 28px -18px rgba(38,30,20,.45),0 3px 8px rgba(38,30,20,.07);
  --drop-up:0 40px 44px -20px rgba(38,30,20,.5),0 6px 14px rgba(38,30,20,.08);
  --ink:#030303; --ink-2:#2E2E2E; --muted:#6E6E6E;
  --paper:#FFFFFF; --tile:#FFFFFF; --tile-hover:#F7F6F4;
  --grout:#E3E1DD; --band:#030303; --band-ink:#FFFFFF; --band-muted:#A8A8A8;
  --red:#C00113; --red-deep:#A30E24;
  --focus:#C00113; --scrim:rgba(3,3,3,.62);
  --font:'Assistant','Heebo','Arial Hebrew',Arial,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#F4F4F4; --ink-2:#D6D6D6; --muted:#9A9A9A;
    --paper:#030303; --tile:#121212; --tile-hover:#1B1B1B;
    --grout:#2A2A2A; --scrim:rgba(0,0,0,.72);
    --slab:0 1px 0 #2C2C2C,0 2px 0 #272727,0 3px 0 #232323,0 4px 0 #1F1F1F,0 5px 0 #1B1B1B,0 6px 0 #181818;
    --drop:0 26px 28px -18px rgba(0,0,0,.9),0 3px 8px rgba(0,0,0,.4);
    --drop-up:0 40px 44px -20px rgba(0,0,0,.95),0 6px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
    --slab:0 1px 0 #2C2C2C,0 2px 0 #272727,0 3px 0 #232323,0 4px 0 #1F1F1F,0 5px 0 #1B1B1B,0 6px 0 #181818;
    --drop:0 26px 28px -18px rgba(0,0,0,.9),0 3px 8px rgba(0,0,0,.4);
    --drop-up:0 40px 44px -20px rgba(0,0,0,.95),0 6px 14px rgba(0,0,0,.4);
  --ink:#F4F4F4; --ink-2:#D6D6D6; --muted:#9A9A9A;
  --paper:#030303; --tile:#121212; --tile-hover:#1B1B1B;
  --grout:#2A2A2A; --scrim:rgba(0,0,0,.72);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:400;
  font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(1.1rem,4vw,3rem)}

/* ---------- header band ---------- */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-top:clamp(1.6rem,4vw,2.6rem);padding-bottom:clamp(2rem,5vw,3.4rem)}
.logo{display:block;width:clamp(150px,18vw,210px);height:auto;user-select:none;-webkit-user-select:none}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;
  margin-top:clamp(2.2rem,6vw,4.2rem)}
.hero h1{margin:0;font-weight:300;font-size:clamp(2.6rem,7vw,5.2rem);line-height:1;letter-spacing:-.02em}
.hero .sub{margin:.9rem 0 0;font-weight:300;font-size:clamp(1.15rem,2.2vw,1.5rem);color:var(--band-ink)}
.hero .rule{width:56px;height:2px;background:var(--red);margin-top:1.1rem}
.hero .date{margin:.9rem 0 0;font-weight:300;font-size:1rem;color:var(--band-muted);font-variant-numeric:tabular-nums}

/* ---------- toolbar ---------- */
.toolbar{position:relative;z-index:5;background:var(--paper);border-bottom:1px solid var(--grout)}
.toolbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding-top:.85rem;padding-bottom:.85rem}
.toolbar .note{margin:0;max-width:62ch;font-size:.95rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--ink);flex:none}
.seg button{border:0;background:transparent;padding:.55rem 1.05rem;cursor:pointer;font-weight:400;font-size:.95rem}
.seg button+button{border-inline-start:1px solid var(--ink)}

/* ---------- sections ---------- */
main{padding-bottom:clamp(3rem,8vw,6rem)}
.section{margin-top:clamp(2.6rem,6vw,4.2rem)}
.section.sub{margin-top:clamp(1.8rem,4vw,2.6rem)}
.sec-head{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;margin-bottom:1rem}
.sec-head h2{margin:0;font-weight:300;font-size:clamp(1.7rem,3.4vw,2.35rem);line-height:1.15;letter-spacing:-.01em}
.section.sub .sec-head h2{font-size:clamp(1.3rem,2.4vw,1.6rem);font-weight:400}
.sec-head .count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.sec-intro{margin:-.4rem 0 1rem;color:var(--ink-2);max-width:70ch}
.sec-note{margin:.9rem 0 0;color:var(--muted);font-size:.92rem;max-width:80ch}
.section.sub{padding-inline-start:clamp(.9rem,2vw,1.4rem);border-inline-start:2px solid var(--red)}

/* tile wall: grout lines drawn by a 1px ring on every tile */
.wall{display:grid;gap:clamp(18px,2.4vw,30px);padding:clamp(8px,1vw,14px) 0 clamp(16px,2vw,24px);grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.mode-full .wall{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.tile{--pad:clamp(1rem,1.8vw,1.35rem);--lean:10deg;--lift:0px;position:relative;background:var(--tile);box-shadow:var(--slab),var(--drop);text-align:start;
  border:0;margin:0;padding:var(--pad);display:flex;flex-direction:column;min-width:0;overflow:hidden}
button.tile,.tile.clickable{cursor:pointer}
.tile.clickable:hover,button.tile:hover{background:var(--tile-hover)}
.tile:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

.mode-compact .tile .name{margin-top:.95rem;min-height:2.4em}
.tile .name{display:block;margin:0;font-weight:400;font-size:clamp(1.15rem,1.6vw,1.32rem);line-height:1.3;overflow-wrap:anywhere}
.mode-compact .tile .name{font-weight:300;font-size:clamp(1.3rem,2vw,1.6rem);line-height:1.2}
.tile .mark{position:absolute;bottom:calc(var(--pad) + .15em);inset-inline-end:var(--pad);width:24px;height:24px;
  opacity:0;transform:rotate(-140deg) scale(.55);transition:opacity .25s,transform .7s cubic-bezier(.2,.8,.2,1)}
.mark circle{fill:none;stroke-width:41.4;stroke-dasharray:360 360;stroke-dashoffset:360;transition:stroke-dashoffset .75s cubic-bezier(.65,0,.25,1)}
.mark .m1{stroke:var(--red)}
.mark .m2{stroke:var(--ink)}
.tile[data-open]:hover .mark,.tile.tilting .mark,.tile:focus-visible .mark{opacity:1;transform:none}
.tile[data-open]:hover .mark circle,.tile.tilting .mark circle,.tile:focus-visible .mark circle{stroke-dashoffset:0}
.mode-full .tile .mark{bottom:var(--pad)}

/* illustrations */
.art-defs{position:absolute;width:0;height:0;overflow:hidden}
.art{position:relative;overflow:hidden;background:#D9D1C3;flex:none}
.art svg{display:block;width:100%;height:100%;transform:scale(1.07) translate(var(--mx,0px),var(--my,0px));
  transition:transform .7s cubic-bezier(.2,.8,.2,1)}

.tile>.art{margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 0;aspect-ratio:16/11}
.mode-full .tile>.art{aspect-ratio:16/8;margin-bottom:.35rem}
.editing .tile>.art{aspect-ratio:16/7;margin-top:0}
.tile.tilting .art svg{transition:transform .12s linear;transform:scale(1.1) translate(var(--mx,0px),var(--my,0px))}

.mode-full .tile{gap:.75rem}
.tile .desc{margin:0;color:var(--ink-2);font-size:1rem;line-height:1.7;overflow-wrap:anywhere;white-space:pre-line}
.tile .eta{margin-top:auto;padding-top:.85rem;border-top:1px solid var(--grout)}
.eta .lbl{display:block;font-size:.85rem;color:var(--muted)}
.eta .val{display:block;font-weight:600;font-size:1.05rem}
.eta .en{display:block;font-size:.9rem;color:var(--muted)}

/* ---------- flip card ---------- */
html.lock{overflow:hidden}
dialog.flip{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;
  border:0;background:transparent;overflow:hidden;color:var(--ink)}
dialog.flip::backdrop{background:transparent}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.fcard{position:absolute;perspective:1800px;will-change:left,top,width,height}
.fcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--tile);
  box-shadow:0 0 0 1px var(--grout),0 40px 90px -30px rgba(0,0,0,.55);overflow:hidden}
.face.front{--pad:clamp(1rem,1.8vw,1.35rem);display:flex;flex-direction:column;padding:var(--pad)}
.face.front>.art{flex:1 1 auto;min-height:0;margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 0}
.face.front .name{margin-top:.95rem;min-height:2.4em;font-weight:300;font-size:clamp(1.3rem,2vw,1.6rem);line-height:1.2}
.face.front .mark{position:absolute;bottom:calc(var(--pad) + .15em);inset-inline-end:var(--pad);width:24px;height:24px}
.face.front .mark circle{stroke-dashoffset:0}
.fb-art{height:clamp(140px,27vh,240px)}
.fb-art svg{transform:scale(1.04)}
.face.back{transform:rotateY(180deg);background:var(--paper)}
.face.back .scroll{height:100%;overflow:auto;overscroll-behavior:contain}
.fcard-measure{position:absolute;visibility:hidden;pointer-events:none;top:0;left:-9999px}
.fcard-measure .face{position:static;box-shadow:none}
.fb-in{padding:clamp(1.5rem,5vw,3.2rem)}
.dl-top{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.dl-sec{color:var(--muted);font-size:.98rem}
.dl-close{border:1px solid var(--grout);background:transparent;width:2.5rem;height:2.5rem;cursor:pointer;
  display:grid;place-items:center;flex:none;transition:border-color .2s, transform .3s}
.dl-close:hover{border-color:var(--ink);transform:rotate(90deg)}
.dl-name{margin:1.2rem 0 0;font-weight:300;font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1.12;letter-spacing:-.015em}
.dl-name .w,.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em;margin-bottom:-.1em}
.dl-name .w>span,.hero h1 .w>span{display:inline-block}
.dl-eta{margin-top:1.6rem;padding-inline-start:1rem;border-inline-start:2px solid var(--red)}
.dl-eta .lbl{font-size:.9rem;color:var(--muted)}
.dl-eta .val{display:block;font-weight:600;font-size:1.3rem}
.dl-eta .en{display:block;color:var(--muted)}
.dl-desc{margin:1.6rem 0 0;font-size:clamp(1.08rem,1.6vw,1.2rem);line-height:1.85;color:var(--ink-2);white-space:pre-line}
.dl-desc .ghost{color:transparent}
.dl-desc .caret{display:none;width:.55em;height:1.05em;background:var(--red);vertical-align:-.15em;margin-inline-start:1px}
.dl-desc.is-typing .caret{display:inline-block}
.dl-nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:2.4rem;
  padding-top:1.1rem;border-top:1px solid var(--grout)}
.dl-nav button{border:1px solid var(--ink);background:transparent;padding:.55rem 1.1rem;cursor:pointer;
  display:inline-flex;align-items:center;gap:.5rem;transition:background-color .2s,color .2s}
.dl-nav button:hover{background:var(--ink);color:var(--paper)}
.dl-nav button:disabled{opacity:.3;cursor:default;background:transparent;color:var(--ink)}
.dl-pos{color:var(--muted);font-variant-numeric:tabular-nums}
.sheen{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 35%,rgba(192,1,19,.10) 47%,rgba(255,255,255,.35) 50%,rgba(192,1,19,.10) 53%,transparent 65%)}
.tile.lifted{visibility:hidden}
.face.back.pre .fb-in>*{opacity:0}

/* ---------- header motion ---------- */
.band{position:relative;overflow:hidden}
.band .wrap{position:relative;z-index:1}
.ring{position:absolute;z-index:0;width:clamp(150px,24vw,330px);height:auto;inset-inline-end:clamp(1rem,7vw,7rem);
  top:50%;transform:translateY(-38%);pointer-events:none}
.ring .arc{fill:none;stroke-width:41.4;stroke-dasharray:360 360}
.ring .a1{stroke:var(--red)}
.ring .a2{stroke:#FFFFFF}
.ring .spin{transform-origin:100px 100px}
.hero .date{position:relative}
.seg{position:relative;isolation:isolate}
.seg .seg-ink{position:absolute;top:0;left:0;height:100%;width:0;background:var(--ink);z-index:-1;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1)}
.seg button[aria-pressed="true"]{background:transparent;color:var(--paper);transition:color .3s}
.count .n{font-weight:400}

/* tiles: 3D tilt + glare */
.tile{transform-origin:50% 100%;
  transform:perspective(1100px) translateY(var(--lift)) rotateX(calc(var(--lean) + var(--rx,0deg))) rotateY(var(--ry,0deg));
  transition:transform .55s cubic-bezier(.2,.8,.2,1),background-color .2s,box-shadow .45s cubic-bezier(.2,.8,.2,1)}
.mode-full .tile{--lean:5deg}
.tile[data-open]:hover,.tile.tilting,.tile[data-open]:focus-visible{--lean:0deg;--lift:-10px;z-index:2;box-shadow:var(--slab),var(--drop-up)}
.tile.tilting{transition:transform .1s linear,background-color .2s,box-shadow .45s cubic-bezier(.2,.8,.2,1)}
.editing .tile{--lean:0deg}
.tile[data-open]::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(192,1,19,.09),transparent 60%)}
.tile.tilting::after{opacity:1}


@media (prefers-reduced-motion:no-preference){
  /* opening sequence: title rises word by word, ring draws itself */
  .band.intro .logo{animation:fadeIn .8s .05s ease-out backwards}
  .band.intro h1 .w>span{animation:rise .95s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.2s + var(--d)*.1s)}
  .band.intro .sub{animation:fadeUp .8s .6s cubic-bezier(.2,.8,.2,1) backwards}
  .band.intro .rule{transform-origin:right;animation:drawX .9s .75s cubic-bezier(.6,0,.2,1) backwards}
  .band.intro .date{animation:fadeIn .8s 1s ease-out backwards}
  .band.intro .ring .arc{animation:drawArc 1.7s .35s cubic-bezier(.65,0,.25,1) backwards}
  
  .band.intro .ring{animation:ringIn 1.6s .2s cubic-bezier(.2,.8,.2,1) backwards}
  .ring .spin{animation:spin 60s linear infinite}

  /* tiles are laid onto the wall one after another */
  .wall.pending .tile{opacity:0}
  .wall.laid .tile{animation:lay .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * var(--step,70ms))}
  .tile.landed{animation:land .5s cubic-bezier(.2,.8,.2,1)}

  /* back of the flip card: name rises, ETA slides, desc types, sheen passes once */
  .face.back.reveal .dl-name .w>span{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.05s + var(--d)*.07s)}
  .face.back.reveal .dl-sec{animation:fadeIn .5s ease-out backwards}
  .face.back.reveal .dl-eta{animation:slideIn .7s .25s cubic-bezier(.2,.8,.2,1) backwards}
  .face.back.reveal .dl-nav{animation:fadeIn .6s .5s ease-out backwards}
  .face.back.reveal .sheen{animation:sheen 1.1s .05s cubic-bezier(.4,0,.2,1)}
  .dl-desc.is-typing .caret{animation:blink .7s steps(1) infinite}
  .dl-desc.typed-done .caret{display:inline-block;animation:caretOut .9s .3s ease-out forwards}
}
@keyframes rise{from{transform:translateY(110%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes drawX{from{transform:scaleX(0)}}
@keyframes drawArc{from{stroke-dashoffset:360}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringIn{from{opacity:0;transform:translateY(-38%) rotate(-50deg) scale(.85)}}
@keyframes lay{from{opacity:0;transform:perspective(1100px) translateY(-6px) rotateX(-78deg)}}
@keyframes land{from{transform:perspective(1100px) translateY(-6px) rotateX(0deg) scale(1.03)}}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}}
@keyframes sheen{0%{opacity:1;transform:translateX(-100%)}100%{opacity:1;transform:translateX(100%)}}
@keyframes blink{50%{opacity:0}}
@keyframes caretOut{to{opacity:0}}

/* ---------- edit mode (owner only) ---------- */
.editing [data-f]{outline:1px dashed transparent;outline-offset:3px;cursor:text}
.editing [data-f]:hover{outline-color:var(--muted)}
.editing [data-f]:focus{outline:1px solid var(--red)}
.editing [data-f]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
.band [data-f]:empty::before{color:var(--band-muted)}
.tile-tools{display:flex;gap:4px;justify-content:flex-end;margin:-.4rem -.4rem .2rem 0}
.tile-tools button{border:1px solid var(--grout);background:var(--paper);height:30px;min-width:30px;padding:0 .5rem;
  cursor:pointer;font-size:.85rem;display:inline-grid;place-items:center}
.tile-tools button:hover{border-color:var(--ink)}
.tile-tools button.armed{background:var(--red);border-color:var(--red);color:#fff}
.tile.add{--lean:0deg;align-items:center;justify-content:center;min-height:140px;color:var(--muted);background:transparent;
  box-shadow:inset 0 0 0 1px var(--grout);outline:1px dashed var(--muted);outline-offset:-10px}
.tile.add:hover{color:var(--ink);background:var(--tile-hover)}
.editbar{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--band);color:#fff;
  padding:.7rem clamp(1rem,4vw,2rem);padding-bottom:calc(.7rem + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.editbar .msg{font-size:.95rem;color:#D0D0D0}
.editbar .acts{display:flex;gap:.5rem}
.editbar button{border:1px solid #fff;background:transparent;color:#fff;padding:.55rem 1.2rem;cursor:pointer}
.editbar button.primary{background:var(--red);border-color:var(--red)}
.editbar button.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.editbar button:disabled{opacity:.5;cursor:default}
body.is-editing main{padding-bottom:7rem}

.toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));
  z-index:30;background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;font-size:.95rem;max-width:calc(100vw - 2rem)}
body.is-editing .toast{bottom:calc(5rem + env(safe-area-inset-bottom,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:760px){.toolbar{position:sticky;top:0}}
@media (max-width:560px){
  .mode-compact .tile .name{font-size:1.08rem}
  .mode-compact .wall{grid-template-columns:1fr 1fr}
  .mode-full .wall{grid-template-columns:1fr}
}
@media print{
  .toolbar .seg,.editbar,.toast,dialog,.ring{display:none!important}
  .wall.pending .tile{opacity:1!important}
  .toolbar{position:static}
  .band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tile{break-inside:avoid;transform:none!important;box-shadow:0 0 0 1px #ddd!important}
}
body.is-editing .toolbar{position:relative}

@media (max-width:560px){.ring{width:64px;top:1.1rem;transform:none;inset-inline-end:auto;inset-inline-start:auto;left:1.1rem}@keyframes ringIn{from{opacity:0}}}

/* ---------- toolbar controls ---------- */
.controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.editbar .dv{display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;color:#D0D0D0}
.editbar select{font:inherit;background:transparent;color:#fff;border:1px solid #fff;padding:.4rem .6rem}
.editbar select option{color:#000}

/* ---------- mosaic ---------- */
.mosaic{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(118px,12.5vw,168px);gap:clamp(10px,1.4vw,18px);grid-auto-flow:dense}
.m-tile{--rx:0deg;--ry:0deg;position:relative;overflow:hidden;border:0;padding:0;margin:0;cursor:pointer;text-align:start;color:#fff;
  background:#1C1C1C;grid-column:span 2;grid-row:span 1;
  transform:perspective(1200px) translateY(var(--lift,0px)) rotateX(var(--rx)) rotateY(var(--ry));
  box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform .55s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.m-tile.s-l{grid-column:span 3;grid-row:span 2}
.m-tile.s-m{grid-column:span 2;grid-row:span 2}
.m-tile.s-h{grid-column:span 3;grid-row:span 1}
.m-tile.s-w{grid-column:span 6;grid-row:span 2}
.m-tile>.art{position:absolute;inset:0}
.m-tile>.art svg{transform:scale(1.08) translate(var(--mx,0px),var(--my,0px))}
.m-tile:hover>.art svg,.m-tile.tilting>.art svg{transform:scale(1.14) translate(var(--mx,0px),var(--my,0px))}
.m-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(3,3,3,.86) 0%,rgba(3,3,3,.55) 32%,rgba(3,3,3,0) 62%);transition:opacity .4s}
.m-info{position:absolute;inset-inline:0;bottom:0;padding:clamp(.9rem,1.6vw,1.3rem);padding-inline-end:3rem;display:flex;flex-direction:column;gap:.3rem}
.m-name{font-weight:300;font-size:clamp(1.1rem,1.7vw,1.5rem);line-height:1.2;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.m-tile.s-l .m-name,.m-tile.s-w .m-name{font-size:clamp(1.35rem,2.4vw,2rem)}
.m-tile.s-h .m-teaser{-webkit-line-clamp:1}
.m-teaser{font-size:.95rem;line-height:1.5;color:rgba(255,255,255,.82);max-width:46ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m-eta{align-self:flex-start;font-size:.82rem;font-weight:600;letter-spacing:.01em;padding:.18rem .55rem;background:rgba(3,3,3,.55);
  border-inline-start:2px solid var(--red);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.m-tile .mark{position:absolute;bottom:clamp(.9rem,1.6vw,1.3rem);inset-inline-end:clamp(.9rem,1.6vw,1.3rem);width:24px;height:24px;
  opacity:0;transform:rotate(-140deg) scale(.55);transition:opacity .25s,transform .7s cubic-bezier(.2,.8,.2,1)}
.m-tile .mark .m2{stroke:#fff}
.m-tile:hover .mark,.m-tile.tilting .mark,.m-tile:focus-visible .mark{opacity:1;transform:none}
.m-tile:hover .mark circle,.m-tile.tilting .mark circle,.m-tile:focus-visible .mark circle{stroke-dashoffset:0}
.m-tile:hover,.m-tile.tilting{--lift:-6px;z-index:2;box-shadow:0 30px 44px -22px rgba(0,0,0,.55)}
.m-tile.tilting{transition:transform .1s linear,box-shadow .45s}
.m-tile:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.m-tile.lifted{visibility:hidden}

/* ---------- timeline ---------- */
.tl-wrap{margin-top:clamp(2rem,5vw,3.2rem)}
.tl-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:.4rem}
.tl{--lw:clamp(220px,26vw,330px);position:relative;min-width:760px}
.tl-overlay{position:absolute;top:0;bottom:0;inset-inline-start:var(--lw);inset-inline-end:0;pointer-events:none;z-index:0}
.tl-line{position:absolute;top:0;bottom:0;width:1px;background:var(--grout)}
.tl-line.q{background:var(--clay-line,#CFC7B9)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;margin-inline-start:-1px;background:var(--red);transform-origin:top}
.tl-today span{position:absolute;top:.15rem;inset-inline-start:6px;font-size:.78rem;font-weight:600;color:var(--red);white-space:nowrap}
.tl-head{display:grid;grid-template-columns:var(--lw) 1fr;align-items:end;position:relative;z-index:1;border-bottom:1px solid var(--ink)}
.tl-corner{padding:.6rem 0;font-size:.85rem;color:var(--muted)}
.tl-months{position:relative;height:3.3rem}
.tl-month{position:absolute;bottom:0;padding:0 .5rem .55rem;font-size:.9rem;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.tl-month b{font-weight:600;color:var(--ink)}
.tl-group{position:relative;z-index:1;padding:1.3rem 0 .45rem;display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.tl-group span{font-weight:400;font-size:1.15rem}
.tl-group em{font-style:normal;color:var(--muted);font-size:.9rem}
.tl-group span,.tl-group em{background:var(--paper);padding-inline-end:.5rem}
.tl-group.sub span{padding-inline-start:.7rem;border-inline-start:2px solid var(--red)}
.tl-row{position:relative;z-index:1;display:grid;grid-template-columns:var(--lw) 1fr;align-items:center;min-height:64px;cursor:pointer;
  border-top:1px solid var(--grout);transition:background-color .2s}
.tl-row:hover{background:color-mix(in srgb,var(--tile-hover) 70%,transparent)}
.tl-row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tl-label{display:flex;align-items:center;gap:.8rem;padding:.55rem 0;padding-inline-end:1rem;position:sticky;inset-inline-start:0;background:var(--paper);z-index:2}
.tl-row:hover .tl-label{background:var(--tile-hover)}
.tl-thumb{flex:none;width:58px;height:42px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tl-thumb svg{width:100%;height:100%;display:block}
.tl-txt{display:flex;flex-direction:column;min-width:0}
.tl-name{font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
.tl-eta{font-size:.85rem;color:var(--muted);font-weight:600}
.tl-latetxt{display:block;font-weight:400}
.tl-track{position:relative;height:100%;min-height:64px}
.tl-bar,.tl-win,.tl-late{position:absolute;top:50%;height:12px;margin-top:-6px;transform-origin:right center}
.tl-bar{background:var(--ink)}
.tl-bar.up{background:transparent;border:1.5px dashed var(--ink);height:12px}
.tl-win{background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 6px);opacity:.55;box-shadow:inset 0 0 0 1.5px var(--ink)}
.tl-win.up{opacity:.35}
.tl-late{height:0;margin-top:0;border-top:2px dashed var(--red)}
.tl-dot{position:absolute;top:50%;width:13px;height:13px;margin-top:-6.5px;margin-inline-start:-6.5px;background:var(--red);transform:rotate(45deg)}
.tl-frozen{position:absolute;inset:14px 0;background:repeating-linear-gradient(-45deg,var(--grout) 0 6px,transparent 6px 12px);display:flex;align-items:center;justify-content:center}
.tl-frozen span{background:var(--paper);padding:.15rem .7rem;font-size:.85rem;color:var(--muted)}
.tl-tbd{position:absolute;top:50%;transform:translateY(-50%);margin-inline-start:12px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.tl-legend{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;margin-top:1rem;font-size:.85rem;color:var(--muted)}
.tl-legend span{display:inline-flex;align-items:center;gap:.45rem}
.tl-legend i{display:inline-block;width:22px;height:10px}
.lg-bar{background:var(--ink)}
.lg-win{background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,transparent 2px 6px);opacity:.55;box-shadow:inset 0 0 0 1.5px var(--ink)}
.lg-late{height:0!important;border-top:2px dashed var(--red)}
.lg-up{border:1.5px dashed var(--ink)}
.lg-today{width:2px!important;height:14px!important;background:var(--red)}
.tl-row.lifted{visibility:hidden}

/* ---------- story ---------- */
html.snap{scroll-snap-type:y proximity}
.view-story{max-width:none;padding:0}
.scene{scroll-margin-top:72px;min-height:92vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;
  gap:clamp(1.5rem,5vw,5rem);padding:clamp(2rem,6vh,4rem) clamp(1.2rem,6vw,6rem);scroll-snap-align:start;border-bottom:1px solid var(--grout)}
.scene.alt{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.scene.alt .sc-art{order:2}
.sc-art{position:relative;aspect-ratio:4/3;overflow:hidden;box-shadow:var(--slab),var(--drop-up)}
.sc-art svg{width:100%;height:100%;display:block}
.sc-text{max-width:620px}
.sc-meta{display:flex;gap:1rem;align-items:baseline;color:var(--muted);font-size:.95rem}
.sc-count{font-variant-numeric:tabular-nums}
.sc-intro{margin:.6rem 0 0;color:var(--ink-2)}
.sc-name{margin:1rem 0 0;font-weight:300;font-size:clamp(2.2rem,4.6vw,3.8rem);line-height:1.08;letter-spacing:-.02em}
.sc-name .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em;margin-bottom:-.1em}
.sc-name .w>span{display:inline-block}
.sc-note{margin:1.4rem 0 0;font-size:.92rem;color:var(--muted)}
.st-nav{position:fixed;z-index:6;inset-inline-end:clamp(.6rem,1.6vw,1.4rem);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;
  opacity:0;pointer-events:none;transition:opacity .4s}
.st-nav.show{opacity:1;pointer-events:auto}
.st-nav button{position:relative;width:26px;height:22px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.st-nav button::before{content:"";width:12px;height:2px;background:var(--muted);transition:width .3s,background-color .3s}
.st-nav button:hover::before{width:20px;background:var(--ink)}
.st-nav button .mark{position:absolute;width:20px;height:20px;opacity:0;transform:rotate(-140deg) scale(.5);transition:opacity .25s,transform .6s cubic-bezier(.2,.8,.2,1)}
.st-nav button.on::before{width:0}
.st-nav button.on .mark{opacity:1;transform:none}
.st-nav button.on .mark circle{stroke-dashoffset:0}
.st-tip{position:absolute;inset-inline-end:calc(100% + 8px);white-space:nowrap;font-size:.85rem;background:var(--ink);color:var(--paper);padding:.25rem .6rem;
  opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .2s;pointer-events:none}
.st-nav button:hover .st-tip,.st-nav button:focus-visible .st-tip{opacity:1;transform:none}

@media (prefers-reduced-motion:no-preference){
  /* mosaic: each tile wipes open, its picture settles */
  .mosaic.pending .m-tile{opacity:0}
  .mosaic.laid .m-tile{animation:wipe .9s cubic-bezier(.65,0,.25,1) backwards;animation-delay:calc(var(--i,0) * var(--step,70ms) * 1.2)}
  .mosaic.laid .m-tile>.art svg{animation:settle 1.4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * var(--step,70ms) * 1.2)}
  .mosaic.laid .m-info{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.45s + var(--i,0) * var(--step,70ms) * 1.2)}
  /* timeline: bars grow out of "today", the today line drops in */
  .tl.pending .tl-bar,.tl.pending .tl-win,.tl.pending .tl-late,.tl.pending .tl-dot,.tl.pending .tl-today{opacity:0}
  .tl.laid .tl-today{animation:dropY .9s cubic-bezier(.65,0,.25,1) backwards}
  .tl.laid .tl-bar{animation:growX .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.3s + var(--i,0) * 60ms)}
  .tl.laid .tl-win,.tl.laid .tl-late{animation:growX .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.75s + var(--i,0) * 60ms)}
  .tl.laid .tl-dot{animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards;animation-delay:calc(1.1s + var(--i,0) * 60ms)}
  .tl.laid .tl-label{animation:fadeIn .6s ease-out backwards;animation-delay:calc(var(--i,0) * 40ms)}
  .tl-row{transition:background-color .2s}
  .tl-row:hover .tl-bar{transform:scaleY(1.35)}
  .tl-bar{transition:transform .3s}
  /* story */
  .scene .sc-art{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.65,0,.25,1)}
  .scene .sc-art svg{transform:scale(1.18);transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}
  .scene.in .sc-art{clip-path:inset(0 0 0 0)}
  .scene.in .sc-art svg{transform:scale(1)}
  .scene .sc-meta,.scene .sc-intro,.scene .dl-eta,.scene .sc-note{opacity:0}
  .scene .sc-name .w>span{transform:translateY(110%)}
  .scene.in .sc-meta{animation:fadeIn .6s .2s ease-out forwards}
  .scene.in .sc-intro{animation:fadeUp .7s .35s cubic-bezier(.2,.8,.2,1) forwards}
  .scene.in .sc-name .w>span{animation:riseIn .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.3s + var(--d)*.08s)}
  .scene.in .dl-eta{animation:slideIn2 .7s .55s cubic-bezier(.2,.8,.2,1) forwards}
  .scene.in .sc-note{animation:fadeIn .7s 1.6s ease-out forwards}
}
@keyframes wipe{from{clip-path:inset(100% 0 0 0);opacity:1}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes settle{from{transform:scale(1.3)}}
@keyframes growX{from{transform:scaleX(0);opacity:1}}
@keyframes dropY{from{transform:scaleY(0);opacity:1}}
@keyframes pop{from{transform:rotate(45deg) scale(0);opacity:1}}
@keyframes riseIn{from{transform:translateY(110%)}to{transform:none}}
@keyframes slideIn2{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

@media (max-width:760px){
  .mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}
  .m-tile.s-l,.m-tile.s-w{grid-column:span 2;grid-row:span 2}

  .st-nav{display:none}
}

  /* the hidden way in: double-click the logo, or Shift+E (owner only) */
  app.addEventListener("dblclick", function (e) { if (e.target.closest(".logo")) { e.preventDefault(); toggleEdit(); } });
  document.addEventListener("keydown", function (e) {
    var typing2 = e.target.closest && e.target.closest("[contenteditable],input,textarea");
    if (!typing2 && e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && e.code === "KeyE") { e.preventDefault(); toggleEdit(); }
    if (editing && (e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S" || e.code === "KeyS")) { e.preventDefault(); save(); }
  });
  window.addEventListener("resize", function () { placeSegInk(false); });

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { placeSegInk(false); });
  loadRemote();
})();
</script>
</body>
</html>
